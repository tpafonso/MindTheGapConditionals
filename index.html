<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conditionals: mind the gap!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one projected screen. Header = tube line of the four rounds; stage = question; footer = team scoreboard. */
  --ink:#0d1b3d;
  --paper:#eef1f6;
  --card:#ffffff;
  --red:#c8102e;
  --muted:#56627c;
  --rule:#d3d9e6;
  --ok:#1d7a3e; --ok-bg:#e2f3e7;
  --bad:#b3261e; --bad-bg:#fbe7e5;
  --display:"Lexend","Helvetica Neue",Arial,sans-serif;
  --body:"Lexend","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --t-zero:#0098d4; --t-first:#00782a; --t-second:#003688;
  --t-third:#b36305; --t-mixa:#9b0056; --t-mixb:#6950a1;
  --bar:#0d1b3d; --on-c:#ffffff; --info:#1f4fa3; --info-bg:#e3ecfb;
  --yellow:#ffd300; --yellow-ink:#7a5c00;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ink:#e8edf7; --paper:#0e1526; --card:#18223a; --red:#ef4458; --muted:#9daac4; --rule:#2d3b5a;
  --ok:#4cc27a; --ok-bg:#15392a; --bad:#ff7a6e; --bad-bg:#40191b;
  --t-zero:#46bfee; --t-first:#3dbb67; --t-second:#7d9ff0; --t-third:#eb9a45; --t-mixa:#ec6aa8; --t-mixb:#ad97e6;
  --bar:#070d1c; --on-c:#0b1220; --info:#a9c3ff; --info-bg:#1d2d52; --yellow:#ffd300; --yellow-ink:#ffd300;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --ink:#e8edf7; --paper:#0e1526; --card:#18223a; --red:#ef4458; --muted:#9daac4; --rule:#2d3b5a;
    --ok:#4cc27a; --ok-bg:#15392a; --bad:#ff7a6e; --bad-bg:#40191b;
    --t-zero:#46bfee; --t-first:#3dbb67; --t-second:#7d9ff0; --t-third:#eb9a45; --t-mixa:#ec6aa8; --t-mixb:#ad97e6;
    --bar:#070d1c; --on-c:#0b1220; --info:#a9c3ff; --info-bg:#1d2d52; --yellow:#ffd300; --yellow-ink:#ffd300;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:clamp(15px,1.15vw + 8px,20px);line-height:1.5;
  display:grid;grid-template-rows:auto 1fr auto;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.1}

/* ── Header ───────────────────────────── */
header{
  background:var(--bar);color:#fff;display:flex;align-items:center;gap:8px 16px;
  padding:8px clamp(16px,3vw,40px) 6px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.01em}
.roundel{width:34px;height:34px;flex:none}
.brand small{display:block;font-weight:500;opacity:.7;font-size:.75em;letter-spacing:.02em}
.line{order:3;flex:1 1 100%;min-width:0;display:flex;align-items:center;position:relative;padding:2px 0 0}
#gramBtn{margin-left:auto}
.line::before{content:"";position:absolute;left:10px;right:10px;top:50%;height:6px;margin-top:-3px;background:rgba(255,255,255,.22);border-radius:3px}
.line .fill{position:absolute;left:10px;top:50%;height:6px;margin-top:-3px;background:var(--linec,var(--red));border-radius:3px;transition:width .4s}
.stops{position:relative;display:flex;justify-content:space-between;width:100%}
.stop{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72em;font-weight:600;opacity:.6;min-width:20px}
.stop i{width:20px;height:20px;border-radius:50%;background:var(--bar);border:4px solid rgba(255,255,255,.5)}
.stop.done{opacity:.85}.stop.done i{border-color:var(--linec,var(--red));background:var(--linec,var(--red))}
.stop.now{opacity:1}.stop.now i{border-color:#fff;background:var(--linec,var(--red));box-shadow:0 0 0 4px rgba(255,255,255,.25);box-shadow:0 0 0 4px color-mix(in srgb,var(--linec,var(--red)) 40%,transparent)}
.stop span{white-space:nowrap}
.hbtn{color:#fff;background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 12px;font-size:.8em;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.1)}

/* ── Stage ───────────────────────────── */
main{overflow:auto;padding:clamp(16px,3vw,40px)}
.stage{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-weight:700;font-size:.8em;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.qbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.qcount{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.lead{font-size:1.05em;font-weight:600;color:var(--muted)}
.sentence{
  background:var(--card);border-radius:14px;border-left:10px solid var(--linec,var(--red));
  padding:clamp(18px,2.6vw,34px) clamp(18px,3vw,40px);
  font-family:var(--display);font-weight:800;font-size:clamp(22px,2.2vw + 8px,40px);line-height:1.2;
  box-shadow:0 2px 0 var(--rule);
}
.sentence .src{display:block;font-family:var(--body);font-size:.36em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.gap{display:inline-block;min-width:4.2em;border-bottom:5px solid var(--red);color:transparent;line-height:1}
.gap.filled{color:var(--red);min-width:0;padding:0 .1em}

/* options */
.opts{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.types{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);
  border:3px solid var(--rule);border-radius:12px;padding:14px 16px;font-weight:600;font-size:1.05em;
  transition:border-color .15s,transform .1s;
}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:translateY(1px)}
.key{flex:none;width:2em;height:2em;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:var(--card);font-weight:800;font-size:.9em}
.opt.type{border-left:10px solid var(--c)}
.opt.type .key{background:var(--c);color:var(--on-c)}
.opt .lab{display:flex;flex-direction:column;line-height:1.2}
.opt .hint{font-weight:500;font-size:.78em;color:var(--muted)}
.opt.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink) inset}
.opt.is-correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.is-correct .key{background:var(--ok)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .key{background:var(--bad)}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}

/* feedback */
.feedback{background:var(--card);border-radius:14px;padding:18px 22px;border-top:6px solid var(--ok);display:flex;flex-direction:column;gap:10px}
.fb-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pill{background:var(--c,var(--ink));color:var(--on-c);border-radius:999px;padding:4px 14px;font-weight:800;font-size:.85em}
.formula{font-family:var(--mono);font-weight:600;font-size:.85em;background:var(--paper);padding:4px 10px;border-radius:6px}

/* production */
.target{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.target .pill{font-size:1.1em;padding:8px 18px}
.prompt{font-family:var(--display);font-weight:800;font-size:clamp(24px,2.4vw + 10px,42px);line-height:1.2}
.write{border:3px dashed var(--rule);border-radius:14px;padding:18px 22px;color:var(--muted);font-weight:600}
.model{background:var(--card);border-radius:14px;padding:18px 22px;border-top:6px solid var(--red)}
.model p{font-family:var(--display);font-weight:700;font-size:1.25em;margin-top:6px}
.model p+p{margin-top:4px}

/* controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls .spacer{flex:1}
.btn{border:3px solid var(--ink);background:var(--card);border-radius:10px;padding:10px 18px;font-weight:800}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#a50d26;border-color:#a50d26}
.btn.dark{background:var(--ink);color:var(--card)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.kbd{font-size:.75em;color:var(--muted)}

/* timer */
.timer{display:flex;align-items:center;gap:10px;font-weight:800;font-variant-numeric:tabular-nums}
.tbar{width:160px;height:12px;border-radius:6px;background:var(--rule);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ok);transition:width .25s linear}
.timer.low .tbar i{background:var(--red)}
.timer.up{color:var(--red)}

/* setup + intro + end */
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(34px,4vw + 12px,72px);font-weight:900;letter-spacing:-.01em}
.hero h1 .red{color:var(--red)}
.hero p{max-width:62ch;color:var(--muted);font-size:1.05em}
.panel{background:var(--card);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:1.15em}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px}
.teamset{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.teamset label{display:flex;flex-direction:column;gap:4px;font-size:.8em;font-weight:700;color:var(--muted)}
.teamset input,select{border:2px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--card);font-weight:600;color:var(--ink);font-size:1.1em}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rlist{list-style:none;display:flex;flex-direction:column;gap:10px}
.rlist li{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.rlist li:last-child{border-bottom:0;padding-bottom:0}
.rnum{grid-row:span 2;width:40px;height:40px;border-radius:50%;border:6px solid var(--red);display:grid;place-items:center;font-weight:900;font-size:.95em}
.rlist strong{font-size:1.05em}
.intro{display:flex;flex-direction:column;gap:18px;padding:clamp(10px,3vw,40px) 0}
.intro .big{font-size:clamp(40px,5vw + 10px,84px);font-weight:900}
.intro p{font-size:1.2em;max-width:60ch}
.podium{display:flex;flex-direction:column;gap:10px}
.prow{color:var(--ink);display:grid;grid-template-columns:3em 1fr auto;align-items:center;gap:14px;background:var(--card);border-radius:12px;padding:12px 18px;font-weight:800;font-size:1.2em}
.prow.first{border:4px solid var(--red)}
.prow .pos{font-size:1.4em;color:var(--red)}
.prow .pts{font-variant-numeric:tabular-nums}

/* ── Scoreboard ───────────────────────── */
footer{background:var(--card);border-top:4px solid var(--ink);padding:10px clamp(16px,3vw,40px)}
.scores{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.team{display:flex;align-items:center;gap:6px;border:2px solid var(--rule);border-radius:999px;padding:3px 4px 3px 12px;font-size:.88em}
.team .nm{font-weight:700}
.team .sc{font-weight:900;font-size:1.2em;min-width:1.4em;text-align:center;font-variant-numeric:tabular-nums}
.team button{width:30px;height:30px;border-radius:50%;border:0;font-weight:900;font-size:1.1em;background:var(--paper)}
.team button.plus{background:var(--ink);color:var(--card)}
.team.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.08)}}
.hide{display:none!important}
.solo-score{display:flex;align-items:center;gap:18px;justify-content:center;font-weight:700;flex-wrap:wrap}
.solo-score .big{font-size:1.5em;font-weight:900;font-variant-numeric:tabular-nums}
.solo-score .meter{width:220px;height:12px;background:var(--rule);border-radius:6px;overflow:hidden}
.solo-score .meter i{display:block;height:100%;background:var(--ok)}
.lines{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lc-year{font-size:.8em;font-weight:800;color:var(--lci,var(--lc));text-transform:uppercase;letter-spacing:.06em}
.linecard{position:relative;text-align:left;background:var(--card);border:3px solid var(--rule);border-radius:14px;padding:18px 20px 16px 30px;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.linecard:hover{border-color:var(--lc)}
.linecard.on{border-color:var(--lc);box-shadow:0 0 0 3px var(--lc) inset}
.lc-bar{position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--lc);border-radius:11px 0 0 11px}
.lc-name{font-family:var(--display);font-weight:900;font-size:1.4em;color:var(--lci,var(--lc))}
.lc-sub{font-weight:700}
.lc-stops{color:var(--muted);font-size:.85em}
.modecards{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
.modecards .panel{border-top:8px solid var(--ink)}
.modecards .panel.solo{border-top-color:var(--red)}
.panel .sub{color:var(--muted);max-width:56ch}
textarea{width:100%;min-height:5.5em;border:3px solid var(--rule);border-radius:12px;padding:12px 14px;font:inherit;font-size:1.1em;font-weight:600;color:var(--ink);background:var(--card);resize:vertical}
textarea:focus{border-color:var(--ink);outline:none}
.verdict{font-weight:800}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.breakdown{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:1fr auto;gap:12px;background:var(--card);border-radius:10px;padding:12px 18px;font-weight:700}
.brow span:last-child{font-variant-numeric:tabular-nums}
@media (max-width:760px){.modecards,.lines{grid-template-columns:1fr}}

@media (max-width:760px){
  .opts,.opts.types{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
    .stop span{display:none}
  .tbar{width:100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ── Grammar tab ───────────────────── */
.g-intro{background:var(--card);border-radius:14px;padding:18px 22px;border-left:8px solid var(--red);max-width:none}
.g-nav{position:sticky;top:calc(-1 * clamp(16px,3vw,40px));z-index:5;display:flex;gap:8px;flex-wrap:wrap;background:var(--paper);padding:12px 0}
.g-chip{border:2px solid var(--c,var(--ink));color:var(--c,var(--ink));background:var(--card);border-radius:999px;padding:4px 14px;font-weight:700;font-size:.85em}
.g-chip:hover{background:var(--c,var(--ink));color:var(--card)}
.g-sec{--tint:var(--paper);--tint:color-mix(in srgb,var(--c) 11%,var(--card));display:flex;flex-direction:column;scroll-margin-top:72px}
.g-head{display:flex;align-items:stretch;flex-wrap:wrap}
.g-label{background:var(--c);color:var(--on-c);font-weight:800;padding:10px 16px;border-radius:12px 0 0 0;display:flex;align-items:center}
.g-title{flex:1;min-width:220px;background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;font-weight:800;border-radius:0 12px 0 0;font-size:1.05em}
.tts{border:2px solid var(--rule);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.8em;flex:none}
.tts:hover{border-color:var(--ink)}
.tts.playing{background:var(--red);border-color:var(--red);color:var(--card)}
.g-card{background:var(--card);padding:20px 22px;border-top:4px solid var(--c);display:flex;flex-direction:column;gap:16px}
.g-sec>:last-child{border-radius:0 0 12px 12px}
.g-note{font-size:1.05em;max-width:78ch}
.g-note strong,.g-rule strong{color:var(--c)}
.g-struct{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g-part{border-left:5px solid var(--c);background:var(--tint);padding:12px 14px;border-radius:0 8px 8px 0}
.g-part .lbl{font-size:.72em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.g-part .form{font-family:var(--mono);font-weight:600;font-size:.82em;margin:4px 0;line-height:1.4}
.g-part .ex{color:var(--muted);font-style:italic}
.g-exs{display:flex;flex-direction:column;gap:12px}
.g-ex .el{font-size:.75em;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--c);display:flex;gap:8px;align-items:center;margin-bottom:4px}
.g-ex .es{background:var(--tint);border-left:4px solid var(--c);padding:10px 14px;font-size:1.05em}
.g-ex .es b{color:var(--c)}
.tag{font-size:.95em;font-weight:800;padding:1px 7px;border-radius:4px;letter-spacing:.04em}
.tag.aff{background:var(--ok-bg);color:var(--ok)}.tag.neg{background:var(--bad-bg);color:var(--bad)}.tag.int{background:var(--info-bg);color:var(--info)}
.g-rule{background:var(--tint);border-left:4px solid var(--c);padding:12px 16px;border-radius:0 8px 8px 0;max-width:none}
.g-err{background:var(--card);border-top:4px solid var(--bad);padding:16px 22px;display:flex;flex-direction:column;gap:8px;margin-top:2px}
.g-err .row{display:flex;gap:10px;align-items:baseline;font-size:1.05em}
.g-err .tw,.g-err .tok{flex:none;font-size:.7em;font-weight:800;padding:2px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.g-err .tw{background:var(--bad-bg);color:var(--bad)}.g-err .tok{background:var(--ok-bg);color:var(--ok)}
.g-err .why{color:var(--muted);font-size:.9em}
.struck{text-decoration:line-through;color:var(--muted)}
.tablewrap{overflow-x:auto;border-radius:0 0 12px 12px;background:var(--card)}
.g-table{width:100%;border-collapse:collapse;min-width:640px}
.g-table th{background:var(--ink);color:var(--card);text-align:left;padding:10px 14px;font-size:.72em;letter-spacing:.08em;text-transform:uppercase}
.g-table td{padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
.g-table tr:last-child td{border-bottom:0}
.g-table td:first-child{font-weight:800;color:var(--c,var(--ink));white-space:nowrap}
.g-table .f{font-family:var(--mono);font-size:.82em}
.glink{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:3px 14px;font-weight:700;font-size:.85em}
.glink:hover{background:var(--ink);color:var(--card)}
.fb-head .glink{margin-left:auto}
@media (max-width:760px){.g-struct{grid-template-columns:1fr}}
.bi{display:flex;flex-direction:column;gap:6px}
.bi p{margin:0;max-width:80ch}
.lg{display:inline-block;font-size:.62em;font-weight:800;letter-spacing:.08em;padding:1px 6px;border-radius:4px;margin-right:8px;vertical-align:.15em;background:var(--ink);color:var(--card)}
.bi.why{font-size:.92em;margin-top:4px}
.g-sub{display:block;font-weight:600;font-size:.8em;color:var(--muted)}
.emo{width:1.5em;height:1.5em;object-fit:contain;vertical-align:-.4em}
.nick{font-weight:700;white-space:nowrap}
.opt .lab .nick{font-size:.82em;margin-top:2px}
.fb-head .nick,.target .nick{font-size:.95em}
.g-table td:first-child .nick{font-size:.8em;color:var(--ink)}
.g-tip{border:2px dashed var(--c);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.g-tip strong{color:var(--c)}
.credit{font-size:.72em;color:var(--muted);align-self:flex-end}
.mark{margin-left:auto;font-weight:900;font-size:1.25em;padding-left:10px}
.opt.is-correct .mark{color:var(--ok)}.opt.is-wrong .mark{color:var(--bad)}
.feedback.bad{border-top-color:var(--bad)}
#fbSay{align-self:flex-start}
.whynot{background:var(--bad-bg);border-left:4px solid var(--bad);padding:8px 12px;border-radius:0 8px 8px 0}
.whynot b{color:var(--bad)}
.startw{font-size:1.05em}
.modelline{font-family:var(--display);font-weight:700;font-size:1.25em}
.rubric{background:var(--card);border-radius:14px;padding:16px 22px;display:flex;flex-direction:column;gap:10px}
.rubric ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.rubric li{display:flex;align-items:center;gap:10px}
.rubric .box{flex:none;width:1.6em;height:1.6em;border-radius:6px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:.85em}
.crit{display:flex;align-items:center;gap:10px;background:transparent;border:0;text-align:left;padding:2px 0;font-weight:600}
.crit.on .box{background:var(--ok);border-color:var(--ok);color:var(--card)}
.rubric-pts{color:var(--muted);font-weight:600}
.rubric-pts b{color:var(--ink)}
.types-res{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:auto minmax(0,1.4fr) minmax(80px,1fr) auto auto;align-items:center;gap:12px}
.trow .meter{height:12px;background:var(--rule);border-radius:6px;overflow:hidden}
.trow .meter i{display:block;height:100%}
.trow .tn{font-weight:800;font-variant-numeric:tabular-nums}
.good{font-weight:800;color:var(--ok)}
#tPlus{padding:10px 12px}
@media (max-width:760px){.trow{grid-template-columns:1fr 1fr}}
.rubric-tip{color:var(--muted);font-style:italic}
#sayBtn{align-self:flex-start}
.ptcards{background:var(--card);border-radius:0 0 12px 12px;padding:0 22px 22px;display:flex;flex-direction:column;gap:12px}
.ptcard{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"pt ar en" "c c c";gap:6px 14px;align-items:start;background:var(--tint);border-left:5px solid var(--c);border-radius:0 10px 10px 0;padding:14px 16px}
.ptcard .ptside:first-child{grid-area:pt}.ptcard .ptarrow{grid-area:ar;font-size:1.6em;font-weight:900;color:var(--c);align-self:center}
.ptcard .ptside:nth-child(3){grid-area:en}.ptcard .ptc{grid-area:c;display:flex;gap:6px;flex-wrap:wrap}
.ptside{display:flex;flex-direction:column;gap:2px;min-width:0}
.ptlab{font-size:.7em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ptside b{font-size:1.15em;color:var(--c)}
.ptt{font-size:.85em;color:var(--muted);font-style:italic}
.pts{margin-top:4px;font-weight:600}
.ptc .pill{font-size:.75em;padding:2px 10px}
@media (max-width:640px){.ptcard{grid-template-columns:1fr;grid-template-areas:"pt" "ar" "en" "c"}.ptcard .ptarrow{transform:rotate(90deg);justify-self:start}}
.sentence .alt{display:block;font-family:var(--body);font-size:.42em;font-weight:600;color:var(--muted);margin-top:10px}
.ptalt{font-size:.9em;color:var(--muted);font-style:italic}
.dictate{background:var(--card);border-radius:12px;padding:10px 16px}
.turnbadge{background:var(--card);color:var(--ink);border:3px solid var(--linec,var(--red));border-radius:999px;padding:5px 16px;font-weight:800}
.team.turn{border-color:var(--linec,var(--red));box-shadow:0 0 0 3px var(--linec,var(--red)) inset}
.steal{background:var(--linec,var(--red));color:var(--on-c);border-radius:10px;padding:8px 14px;font-weight:700}
:root .steal{color:#0b1220;background:#ffd300}
</style>
</head>

function voices(){
  const vs = speechSynthesis.getVoices();
  return {pt: vs.find(v=>v.lang==="pt-PT")||vs.find(v=>v.lang.startsWith("pt"))||null,
          en: vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang.startsWith("en"))||null};
}
function stopSpeech(){
  ttsOn = null;
  if(HAS_TTS){ try{ speechSynthesis.cancel(); }catch(e){} }
  document.querySelectorAll(".tts.playing").forEach(b=>{ b.classList.remove("playing"); b.textContent=TTS_IDLE; });
}
function speak(id){
  const was = ttsOn; stopSpeech(); if(was===id) return;
  const g = GRAMMAR.find(x=>x.id===id); if(!g) return;
  const segs = [];
  if(g.tip) segs.push({l:"en",t:strip(g.tip.en)});
  segs.push({l:"en",t:strip(g.note.en)});
  g.forms.forEach(f=>{ segs.push({l:"en",t:formLabel(f)[0]+"."}); segs.push({l:"en",t:f.ex.replace(/[✓✗]/g,"")}); });
  (g.examples||[]).forEach(e=>segs.push({l:"en",t:strip(e.en)}));
  if(g.rule) segs.push({l:"en",t:strip(g.rule.en)});
  const V = voices();
  ttsOn = id;
  const btn = document.querySelector(`[data-tts="${id}"]`);
  if(btn){ btn.classList.add("playing"); btn.textContent=TTS_PLAY; }
  let i = 0;
  const nextSeg = ()=>{
    if(ttsOn!==id) return;
    if(i>=segs.length){ stopSpeech(); return; }
    const s = segs[i++];
    const txt = noPT(s.t);
    if(!txt){ nextSeg(); return; }
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = s.l==="pt" ? "pt-PT" : "en-GB";
    if(V[s.l]) u.voice = V[s.l];
    u.rate = s.l==="en" ? 0.92 : 1;
    u.onend = nextSeg; u.onerror = nextSeg;
    try{ speechSynthesis.speak(u); }catch(e){ stopSpeech(); }
  };
  nextSeg();
}

/* ── Answer checking for "Join the sentences" ───────────────── */
function norm(t){
  t = " " + String(t).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[^a-z' ]+/g," ").replace(/\s+/g," ").trim() + " ";
  t = t.split(" won't ").join(" will not ").split(" can't ").join(" cannot ").split(" can not ").join(" cannot ");
  t = t.replace(/n't /g," not ");
  t = t.replace(/(\w)'ll /g,"$1 will ");
  t = t.replace(/(\w)'d have /g,"$1 would have ");
  t = t.replace(/^ if (\w+)'d /,(m,a)=>" if "+a+" had ");
  t = t.replace(/(\w)'d /g,"$1 would ");
  t = t.replace(/(\w)'m /g,"$1 am ").replace(/(\w)'re /g,"$1 are ");
  return t.replace(/\s+/g," ").trim();
}
function extraS(n){
  const OK = ["is","has","was","does","this","us","bus","as","yes","always","plus","its","his"];
  const re = /\b(can|cannot|could|will|would|might|should|do|does|did)( not)? (\w+)\b/g; let m;
  while((m = re.exec(n))){ const w = m[3]; if(/s$/.test(w) && !/ss$/.test(w) && !OK.includes(w)) return true; }
  return false;
}
function checkTransform(it, text){
  let n = norm(text);
  const C = it.conj || "if", CL = C.includes(" ") ? `“${C}” clause` : `${C}-clause`;
  if(!n.startsWith(C+" ") && n.includes(" "+C+" ")){ const k = n.indexOf(" "+C+" "); n = n.slice(k+1)+" "+n.slice(0,k); }
  const ifOk = new RegExp(it.ifRe).test(n), resOk = new RegExp(it.resRe).test(n);
  const willIf = new RegExp(`\\b(if|${C}) \\w+ (will|would)\\b`).test(n);
  const doubleNeg = C==="unless" && /\bunless \w+ (do|does|did|is|are|am|was|were|can|could) not\b/.test(n);
  const ok = n.length>0 && ifOk && resOk && !willIf && (!it.okRe || new RegExp(it.okRe).test(n));
  const RESFORM = {zero:/\b(cannot|can|do not|does not|never|\w+s|stay|sleep|melt)\b/, first:/\b(will|am going to|are going to|is going to)( not)? \w+/,
    second:/\b(would|could|might)( not)? (?!have\b)\w+/, third:/\bwould( not)? have \w+/, mixa:/\bwould( not)? (?!have\b)\w+/, mixb:/\bwould( not)? have \w+/};
  const resPart = n.replace(new RegExp(`^${C} .*?\\b(?=(i|we|she|he|it|you|they) (will|would|could|might|cannot|can|do|does|am|are|is)\\b)`), "");
  const resFormOk = !!(RESFORM[it.type] && resPart!==n && RESFORM[it.type].test(resPart));
  const [ifP, res] = splitFormula(it.formula || TYPES[it.type].formula);
  let hint = "";
  if(!ok){
    if(doubleNeg) hint = "Unless already means if… not, so don't add another negative: Unless you hurry…";
    else if(willIf) hint = `In this sentence, we don't use will or would after ${C}.`;
    else if(it.fixedWere && /\bif i was you\b/.test(n)) hint = "If I were you is a fixed phrase: use were.";
    else if(!ifOk) hint = `Check the ${CL}. You need: ${ifP.charAt(0).toLowerCase()+ifP.slice(1)}.`;
    else if(extraS(n)) hint = "After can't, doesn't, will, would and similar verbs, use the infinitive without -s: he can't sleep.";
    else if(resFormOk) hint = "Your verb forms are right. Check the meaning: should the result be positive or negative?";
    else hint = `Check the result. You need: ${res}.`;
  } else {
    const tips = [];
    if(/\bif (\w+ ){1,3}?was\b/.test(n) && !/\bif i was you\b/.test(n)) tips.push("In writing, were is the preferred form for every person: If she were…, If he were…");
    if(new RegExp(`^\\s*${C}\\b`,"i").test(text) && !text.includes(",")) tips.push(`Tip: put a comma after the ${CL}.`);
    hint = tips.join(" ");
  }
  return {ok, hint};
}

const PT_RE = /(se (?:\(eu\) |ela )(?:for|fosse|tivesse (?:ido|perdido|tido))|comprar-te-ei|comprar-te-ia|comprava(?:-te)?|compraria|compro-te|vou comprar-te|tivesse (?:ido|perdido|tido)|ter-te-ia comprado|ter-me-iam dado|tinha-te comprado|tinham-me dado|agora tinha|futuro do conjuntivo|ser homem|sempre que|quando (?:ela acabar|eu chegar|te vir)|a não ser que|a menos que)/gi;
function splitLang(text){
  const segs = []; let last = 0, m; PT_RE.lastIndex = 0;
  while((m = PT_RE.exec(text))){
    if(m.index > last) segs.push({t:text.slice(last, m.index), l:"en-GB"});
    segs.push({t:m[0], l:"pt-PT"}); last = m.index + m[0].length;
  }
  if(last < text.length) segs.push({t:text.slice(last), l:"en-GB"});
  return segs.filter(sg=>sg.t.trim());
}
/* Audio is English only: sentences or phrases that contain Portuguese are skipped. */
const PT_MARK = /[ãõçáíóúâêôà]|\((eu)\)|\b(se|eu|ela|ele|ti|te|presente|londres|tinha|tivesse|fosse|quando|que|ter|comprava|compraria|sempre|vir|chegar|acabar)\b/i;
function noPT(text){
  const PTX = new RegExp(PT_RE.source, "i");
  const out = []; let skipNext = false;
  String(text).split(/(?<=[.!?:;])\s+|\n+/).map(x=>x.trim()).filter(Boolean).forEach(x=>{
    const pt = PT_MARK.test(x) || PTX.test(x);
    if(pt || skipNext){
      skipNext = pt && /:$/.test(x);   // the part after "Portuguese words:" only makes sense with them
      if(out.length && /:$/.test(out[out.length-1])) out[out.length-1] = out[out.length-1].replace(/:$/,".");
      return;
    }
    out.push(x);
  });
  return out.join(" ");
}
function sayQueue(segs){
  if(!HAS_TTS) return;
  try{ speechSynthesis.cancel(); }catch(e){}

  segs.forEach(sg=>{
    const u = new SpeechSynthesisUtterance(String(sg.t).replace(/[✓✗]/g,"").replace(/\p{Extended_Pictographic}/gu,"").replace(/\((eu)\)/g,"$1"));
    u.lang = sg.l; const v = V[sg.l.startsWith("pt") ? "pt" : "en"]; if(v) u.voice = v;
    u.rate = sg.l.startsWith("pt") ? 1 : 0.92;

  });
}
function turnIdx(){
  if(!S.teams.length) return -1;
  const n = ROUNDS.slice(0,S.r).reduce((t,r)=>t+r.items.length,0) + Math.max(S.q,0);

}
function dictTeam(){ const i = turnIdx(); return i<0 ? "One team" : S.teams[i].name; }
function award(delta){

}

  const tries = (prev.tries||0) + 1;
  S.ans[key()] = {text, revealed:true, pts: res.ok?1:0, hint: res.hint, tries};
  if(!solo() && !prev.revealed) award(res.ok?1:0);
  S.revealed = true; S.justRevealed = true; render();
}
function choose(i){
  if(S.revealed) return;
  const r = ROUNDS[S.r], it = r.items[S.q];
  S.sel = i; S.revealed = true; S.justRevealed = true; stopTimer();
  const pts = i===correctIndex(r,it) ? 1 : 0;
  S.ans[key()] = {sel:i, revealed:true, pts};
  if(!solo()) award(pts);
  render();
}

/* ── Timer ───────────────── */
function startTimer(sec){
  stopTimer();
  timer.total = sec; timer.left = sec; timer.end = Date.now() + sec*1000;
  timer.id = setInterval(tick, 250);
  paintTimer();
}
function tick(){
  timer.left = Math.max(0, Math.ceil((timer.end-Date.now())/1000));
  paintTimer();
  if(timer.left<=0){ clearInterval(timer.id); timer.id=null; }
}
function addTime(){
  if(!timer.id){ startTimer(timeFor(ROUNDS[S.r]) + 30); return; }
  timer.end += 30000; timer.total += 30; tick();
}
function paintTimer(){
  const el = $("timer"); if(!el || !timer.total) return;
  $("tNum").textContent = timer.left>0 ? timer.left : "Time's up!";
  $("tFill").style.width = (timer.left/timer.total*100)+"%";
  el.classList.toggle("low", timer.left<=Math.max(5, timer.total*0.2));
  el.classList.toggle("up", timer.left===0);
  $("tBtn").textContent = timer.left>0 ? "Restart timer" : "Start again";
}

/* ── End ───────────────── */
function renderEnd(){
  if(solo()){
    const sc = soloScore(), pct = Math.round(sc/TOTAL*100);
    const msg = pct>=85 ? "Excellent! If you keep this up, the conditionals will never trick you again."
              : pct>=60 ? "Good work. Have a look at the hints below, then try again."
              : "Keep practising. Have a look at the hints below, then have another go.";
    const per = {};
    ROUNDS.forEach((r,ri)=> r.items.forEach((it,qi)=>{
      const t = typeOf(r,it), a = S.ans[ri+"-"+qi];
      per[t] = per[t] || {e:0, m:0}; per[t].m += maxPts(r); per[t].e += (a && a.pts) || 0;
    }));
    const byType = [...lineKeys(), ...TYPE_KEYS.filter(k=>!lineKeys().includes(k))].filter(k=>per[k]).map(k=>{
      const p = per[k], q = Math.round(p.e/p.m*100), T = TYPES[k];
      const act = q>=75 ? `<span class="good">✓ Well done</span>` : `<button type="button" class="glink" data-gram="g-${k}">📖 Review</button>`;
      return `<div class="trow"><span class="pill" style="--c:${T.c}">${T.label}</span>${nickHTML(k)}
        <div class="meter" aria-hidden="true"><i style="width:${q}%;background:${T.c}"></i></div><span class="tn">${p.e} / ${p.m}</span>${act}</div>`;
    }).join("");
    const byStop = ROUNDS.map((r,i)=>`<div class="brow"><span>${i+1}. ${esc(r.title)}</span><span>${soloScore(i)} / ${r.items.length*maxPts(r)}</span></div>`).join("");
    $("stage").innerHTML = `
      <section class="hero"><span class="eyebrow">${esc(LINES[S.line].name)} · end of the line · your results</span>
        <h1><span class="red">${sc} / ${TOTAL}</span> · ${pct}%</h1><p>${msg}</p></section>
      <section class="panel"><h2>What to review</h2><p class="sub">A hint, not a test result: some conditionals have only a few questions on this line.</p><div class="types-res">${byType}</div></section>
      <section class="panel"><h2>By stop</h2><div class="breakdown">${byStop}</div></section>
      <div class="controls"><button class="btn" type="button" id="backBtn">Back</button>
        <span class="spacer"></span>
        <button class="btn" type="button" id="menuBtn">Change line or mode</button>
        <button class="btn primary" type="button" id="againBtn">Try again</button></div>`;
    $("backBtn").onclick = back;
    $("menuBtn").onclick = ()=>{ S.phase="setup"; setLine(S.line); render(); };
    $("againBtn").onclick = ()=> start("solo");
    return;
  }
  const ranked = S.teams.map(t=>({...t})).sort((a,b)=>b.score-a.score);
  const top = ranked.filter(t=>t.score===ranked[0].score);
  let pos=0, prev=null;
  const rows = ranked.map((t,i)=>{ if(t.score!==prev){pos=i+1;prev=t.score;}
    return `<div class="prow ${pos===1?"first":""}"><span class="pos">${pos}</span><span>${esc(t.name)}</span><span class="pts">${t.score} pts</span></div>`; }).join("");
  $("stage").innerHTML = `
    <section class="hero"><span class="eyebrow">${esc(LINES[S.line].name)} · end of the line</span>
      <h1>${ranked[0].score>0 ? `<span class="red">${esc(top.map(t=>t.name).join(" & "))}</span> win${top.length>1?"":"s"}!` : "Final scores"}</h1>
      <p>Well done, everyone! If you keep practising, you'll all be conditional experts.</p></section>
    <div class="podium">${rows}</div>
    <div class="controls"><button class="btn" type="button" id="backBtn">Back</button>
      <span class="spacer"></span><button class="btn primary" type="button" id="againBtn">Play again</button></div>`;
  $("backBtn").onclick = back;
  $("againBtn").onclick = ()=>{ S.phase="setup"; setLine(S.line); render(); };
}

/* ── Navigation ───────────────── */
function reveal(){
  if(S.phase!=="play"||S.q<0||S.revealed) return;
  const r = ROUNDS[S.r];
  if(solo() && r.kind!=="produce") return;
  S.revealed = true; S.justRevealed = true; stopTimer();
  if(solo()) S.ans[key()] = {...(S.ans[key()]||{}), revealed:true, pts:(S.ans[key()]||{}).pts||0};
  render();
}
function next(){
  if(S.phase!=="play") return;
  stopTimer();
  const r = ROUNDS[S.r];
  if(S.q < r.items.length-1){ S.q++; }
  else if(S.r < ROUNDS.length-1){ S.r++; S.q=-1; }
  else { S.phase="end"; }
  S.sel=null; S.revealed=false; loadSolo(); render();
}
function back(){
  stopTimer();
  if(S.phase==="end"){ S.phase="play"; S.r=ROUNDS.length-1; S.q=ROUNDS[S.r].items.length-1; }
  else if(S.q>=0){ S.q--; }
  else if(S.r>0){ S.r--; S.q=ROUNDS[S.r].items.length-1; }
  else { S.phase="setup"; setLine(S.line); }
  S.sel=null; S.revealed=false; loadSolo(); render();
}
function render(){
  $("gramBtn").textContent = S.view==="grammar" ? (S.phase==="setup" ? "← Start" : "← Quiz") : "📖 Grammar";
  if(S.view==="grammar"){ renderGrammar(); renderLine(); $("footer").classList.add("hide"); return; }
  if(S.phase==="setup") renderSetup();
  else if(S.phase==="end") renderEnd();
  else if(S.q<0) renderIntro();
  else renderQuestion();
  renderLine(); renderScores();
  const fb = $("fb");
  if(S.justRevealed && fb){
    const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    fb.scrollIntoView({block:"nearest", behavior: smooth?"smooth":"auto"});
  } else document.querySelector("main").scrollTop = 0;
  S.justRevealed = false;
}

document.addEventListener("keydown", e=>{
  if(S.view==="grammar") return;
  if(S.phase!=="play" && S.phase!=="end") return;
  if(e.target.matches("input,select,textarea")) return;
  const k = e.key;
  const inQ = S.phase==="play" && S.q>=0;
  if(k==="ArrowRight"){ e.preventDefault(); next(); }
  else if(k==="ArrowLeft"){ e.preventDefault(); back(); }
  else if(k===" " && inQ){ e.preventDefault(); reveal(); }
  else if((k==="t"||k==="T") && inQ && !solo() && S.timeMul>0){ startTimer(timeFor(ROUNDS[S.r])); }
  else if(inQ && !S.revealed){
    const r = ROUNDS[S.r]; let i=-1;
    if(r.kind==="classify" && /^[1-9]$/.test(k) && +k<=lineKeys().length) i=+k-1;
    if(r.kind==="mcq" && /^[a-dA-D]$/.test(k)) i="abcd".indexOf(k.toLowerCase());
    if(i>=0) choose(i);
  }
});

$("gramBtn").onclick = ()=>{ if(S.view==="grammar") closeGrammar(); else openGrammar(); };
$("fsBtn").onclick = async ()=>{
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch(err){ $("fsBtn").textContent = "Full screen unavailable"; }
};
document.addEventListener("fullscreenchange", ()=>{ $("fsBtn").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"; });

/* ── Theme ───────────────── */
function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function read(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  const dark = t==="dark";
  $("themeBtn").textContent = dark ? "☀ Light" : "☾ Dark";
  $("themeBtn").setAttribute("aria-pressed", String(dark));
}
(function initPrefs(){
  const host = document.documentElement.getAttribute("data-theme");
  const sys = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(read("lc-theme") || host || sys);
})();
$("themeBtn").onclick = ()=>{ const t = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark"; applyTheme(t); store("lc-theme",t); };

setLine(0);
render();
</script>
</body>
</html>
